
title: 제조 문서 청킹 성능 평가
dataset_label: Manufacturing Basic
purpose: 동일한 검색 조건에서 세 청킹 방식의 검색 품질과 처리 비용 비교

result_files:
  c1: e02_c1_m1_p0_r1_20261110_1926_retrieval.json
  c2: e02_c2_m1_p0_r1_20261110_1926_retrieval.json
  c3: e02_c3_m1_p0_r1_20261110_1926_retrieval.json

settings:
  evaluation_questions: 30
  evaluated_questions: 29
  context_token_budget: 1582
  embedding: m1
  retrieval: r1
  selected_chunk_version: c1

id_definitions:
  c1:
    type: chunk
    label: 페이지 단위
    description: 1페이지를 1청크로 사용
  c2:
    type: chunk
    label: 페이지 내 분할
    description: 페이지 안에서 508토큰 이하로 재귀 분할, overlap 50토큰
  c3:
    type: chunk
    label: 페이지 간 분할
    description: 페이지 경계를 넘어 508토큰 이하로 재귀 분할, overlap 50토큰
  m1:
    type: embedding
    label: Multilingual E5 Base
    description: intfloat/multilingual-e5-base, 입력 한도 512토큰
  p0:
    type: prompt
    label: 프롬프트 미적용
    description: 답변 생성 없이 검색 품질만 평가
  r1:
    type: retrieval
    label: Naive
    description: 임베딩 벡터 유사도 기반 검색
