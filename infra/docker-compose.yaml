services:
  qdrant:
    image: qdrant/qdrant:v1.20.0   # 설치된 qdrant-client 1.20과 버전을 맞춤
    container_name: manufacturing-rag-qdrant
    ports:
        - "127.0.0.1:6333:6333"   # REST API, 대시보드(이 컴퓨터에서만 접속)
        - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage   # 컨테이너를 지워도 색인이 남도록 Docker 볼륨에 저장

volumes:
  qdrant_storage: