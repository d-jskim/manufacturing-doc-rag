retrieval_version: r2
label: Hybrid
description: 벡터 검색과 키워드 검색 결과를 결합
method: hybrid                 # 의미 검색(임베딩)과 키워드 검색(BM25) 결과를 순위로 결합
candidate_count: 20            # 결합 후 문맥을 채우기 전에 넘길 후보 청크 수(r1과 같게 맞춤)
exact: true                    # 의미 검색은 r1과 같이 전체 비교(exact)
compare_ann: true              # 의미 검색을 근사 검색(ANN)으로도 실행해 결과·시간을 함께 기록
dense_candidate_count: 20      # 의미 검색에서 가져올 후보 수
keyword_candidate_count: 20    # 키워드 검색에서 가져올 후보 수
keyword_tokenizer: whitespace  # 키워드 검색 단어 분리 사전 실험(experiments/04_retrieval/) 결과
fusion: rrf                    # Reciprocal Rank Fusion: 점수 척도가 달라도 순위만으로 결합
rrf_k: 60                      # RRF 결합 상수(RRF 원 논문 기본값)
