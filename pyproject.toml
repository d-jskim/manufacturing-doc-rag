[project]
name = "manufacturing-doc-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.3",
    "kiwipiepy>=0.24.1",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
    "tiktoken>=0.14.0",
    "torch>=2.11.0",
    "transformers>=5.22.2",
    "uvicorn>=0.54.0",
]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
